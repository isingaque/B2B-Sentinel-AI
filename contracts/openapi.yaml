      - items
      - page
      - page_size
      - total
    RunbookCreateRequest:
      type: object
      properties:
        title: *id013
        condition_text: *id014
        category:
          anyOf:
          - *id004
          - type: 'null'
        severity:
          anyOf:
          - *id011
          - type: 'null'
        is_active:
          type: boolean
          default: true
        steps:
          type: array
          items:
            $ref: '#/components/schemas/RunbookStepCreate'
          minItems: 1
          maxItems: 30
      required:
      - title
      - condition_text
      - steps
    RunbookUpdateRequest:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
        title: *id013
        condition_text: *id014
        category:
          anyOf:
          - *id004
          - type: 'null'
        severity:
          anyOf:
          - *id011
          - type: 'null'
        is_active:
          type: boolean
        steps:
          type: array
          items:
            $ref: '#/components/schemas/RunbookStepCreate'
          minItems: 1
          maxItems: 30
      required:
      - version
      - title
      - condition_text
      - category
      - severity
      - is_active
      - steps
    RunbookImportResult:
      type: object
      properties:
        created_count:
          type: integer
          minimum: 0
      required:
      - created_count
    RecommendationStep:
      type: object
      properties:
        position:
          type: integer
          minimum: 1
        instruction:
          type: string
        is_risky:
          type: boolean
      required:
      - position
      - instruction
      - is_risky
    Recommendation:
      type: object
      properties:
        id: *id001
        incident_id: *id001
        runbook_id: *id001
        runbook_version:
          type: integer
          minimum: 1
        runbook_title:
          type: string
        score:
          type: number
          minimum: 0
          maximum: 1
        reason:
          type: string
        steps_snapshot:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationStep'
        is_adopted:
          type: boolean
        created_at: *id007
      required:
      - id
      - incident_id
      - runbook_id
      - runbook_version
      - runbook_title
      - score
      - reason
      - steps_snapshot
      - is_adopted
      - created_at
    RecommendationList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Recommendation'
