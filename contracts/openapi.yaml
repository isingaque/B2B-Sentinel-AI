        before:
          anyOf:
          - &id015
            type: object
            additionalProperties: true
          - type: 'null'
        after:
          anyOf:
          - *id015
          - type: 'null'
        request_id:
          anyOf:
          - type: string
          - type: 'null'
        created_at: *id007
      required:
      - id
      - incident_id
      - actor_username
      - action
      - entity_kind
      - entity_id
      - before
      - after
      - request_id
      - created_at
    AuditList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
