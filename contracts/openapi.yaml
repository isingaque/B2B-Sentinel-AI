          - done
          - skipped
        note:
          anyOf:
          - type: string
          - type: 'null'
        updated_by:
          anyOf:
          - *id001
          - type: 'null'
        updated_at:
          anyOf:
          - *id007
          - type: 'null'
      required:
      - id
      - incident_id
      - recommendation_id
      - position
      - instruction
      - status
      - note
      - updated_by
      - updated_at
    ChecklistList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistItem'
      required:
      - items
