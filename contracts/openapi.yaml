      - source_id
      - source_name
      - alert_name
      - title
      - description
      - labels
      - annotations
      - monitor_state
      - workflow_status
      - severity
      - category
      - priority
      - started_at
      - last_seen_at
      - resolved_at
      - acknowledged_at
      - acknowledged_by
      - closed_at
      - closed_by
      - resolution_note
    IncidentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Incident'
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
      required:
      - items
      - page
      - page_size
      - total
    Analysis:
      type: object
      properties:
        id: *id001
        status:
          type: string
          enum:
          - pending
          - running
          - completed
          - failed
        severity:
          anyOf:
          - *id011
          - type: 'null'
        category:
          anyOf:
          - *id004
          - type: 'null'
        priority:
          anyOf:
          - *id012
          - type: 'null'
        confidence:
          anyOf:
          - type: number
            minimum: 0
            maximum: 1
          - type: 'null'
        review_required:
          type: boolean
        explanation:
          anyOf:
          - type: string
          - type: 'null'
        model_version:
          type: string
        error_code:
          anyOf:
          - type: string
          - type: 'null'
        created_at: *id007
        completed_at:
          anyOf:
          - *id007
          - type: 'null'
      required:
      - id
      - status
      - severity
      - category
      - priority
      - confidence
      - review_required
      - explanation
      - model_version
      - error_code
      - created_at
      - completed_at
    RunbookStepCreate:
      type: object
