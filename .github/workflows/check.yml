name: Code checks
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Test local AI
        working-directory: backend
        run: pytest -q && PYTHONPATH=. python ../scripts/evaluate_ai.py
      - name: Evaluate published Prometheus rules (diagnostic, not an acceptance gate)
        working-directory: backend
        run: PYTHONPATH=. python ../scripts/evaluate_public_rules.py
      - name: Evaluate seed runbook retrieval (hash mode)
        working-directory: backend
        run: PYTHONPATH=. python ../scripts/evaluate_retrieval.py --backend hash
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install
        working-directory: frontend
        run: npm install
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build
