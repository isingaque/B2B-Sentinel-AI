name: Code checks
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Train local supervised ML model (train+validation only)
        working-directory: backend
        run: PYTHONPATH=. python -m app.ml_v14 --train
      - name: Evaluate trained model on validation exporters
        working-directory: backend
        run: PYTHONPATH=. python ../scripts/evaluate_ml_v14.py
      - name: Test local AI
        working-directory: backend
        run: pytest -q && PYTHONPATH=. python ../scripts/evaluate_ai.py
      - name: Evaluate published Prometheus rules (diagnostic, not an acceptance gate)
        working-directory: backend
        run: PYTHONPATH=. python ../scripts/evaluate_public_rules.py
      - name: Evaluate legacy on untouched-exporter holdout
        working-directory: backend
        run: PYTHONPATH=. python ../scripts/evaluate_public_rules.py --engine legacy --dataset tests/fixtures/heldout_prometheus_rules.csv
      - name: Evaluate offline v2 on original synthetic cases (diagnostic)
        working-directory: backend
        run: PYTHONPATH=. python ../scripts/evaluate_ai.py --engine v2 --no-gate
      - name: Evaluate offline v2 on development corpus
        working-directory: backend
        run: PYTHONPATH=. python ../scripts/evaluate_public_rules.py --engine v2
      - name: Evaluate offline v2 on untouched-exporter holdout
        working-directory: backend
        run: PYTHONPATH=. python ../scripts/evaluate_public_rules.py --engine v2 --dataset tests/fixtures/heldout_prometheus_rules.csv
      - name: Evaluate source-assisted classification on other exporters
        working-directory: backend
        run: PYTHONPATH=. python ../scripts/evaluate_public_rules.py --engine v2 --mode source --dataset tests/fixtures/heldout_prometheus_rules.csv
      - name: Evaluate full Prometheus event metadata (severity passthrough)
        working-directory: backend
        run: PYTHONPATH=. python ../scripts/evaluate_public_rules.py --engine v2 --mode operational --dataset tests/fixtures/heldout_prometheus_rules.csv
      - name: Evaluate seed runbook retrieval (hash mode)
        working-directory: backend
        run: PYTHONPATH=. python ../scripts/evaluate_retrieval.py --backend hash
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install
        working-directory: frontend
        run: npm install
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build
